# Engine infrastructure CI v1 - synchronized - v0.7
name: engine-smoke

permissions:
  contents: read
  issues: write
  pull-requests: write

on:
  push:
    branches:
      - feat/engine-infra-v0.1
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "config/engine/**"
      - "config/graph/**"
      - "config/geography/**"
      - "config/countries/**"
      - "pyproject.toml"
      - ".github/workflows/engine-smoke.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests
        run: |
          set +e
          pytest -q --tb=short > /tmp/pytest.log 2>&1
          status=$?
          cat /tmp/pytest.log
          if [ "$status" -ne 0 ]; then
            {
              echo "### Pytest failure"
              echo '~~~text'
              tail -n 220 /tmp/pytest.log
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
      - name: Publish pytest debug tail
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Temporary CI debug for commit ${GITHUB_SHA}"
            echo '~~~text'
            tail -n 180 /tmp/pytest.log
            echo '~~~'
          } > /tmp/pytest-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/pytest-comment.md
      - name: Spain smoke replay
        run: |
          iwsim smoke             --repo-root .             --country config/countries/spain.yaml             --seed 42             --days 30             --git-commit "${GITHUB_SHA}"             --out /tmp/iwsim-spain
      - name: Morocco smoke replay
        run: |
          iwsim smoke             --repo-root .             --country config/countries/morocco.yaml             --seed 42             --days 30             --git-commit "${GITHUB_SHA}"             --out /tmp/iwsim-morocco
      - name: Atomic day smoke
        run: |
          iwsim day-smoke --repo-root . --seed 42 --git-commit "${GITHUB_SHA}" --out /tmp/iwsim-day

# Temporary v0.28 diagnostic workflow; restored before merge.
name: engine-smoke

on:
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/engine-smoke.yml"

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source exists
        run: test -f src/iwsim/fractal_regional_regime.py

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile v0.28 module
        run: python3 -m py_compile src/iwsim/fractal_regional_regime.py

# Temporary v0.28 diagnostic workflow; restored before merge.
name: engine-smoke

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "config/engine/**"
      - "pyproject.toml"
      - ".github/workflows/engine-smoke.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax location <=500
        run: |
          python - <<'PY'
          import ast
          source = open("src/iwsim/fractal_regional_regime.py", encoding="utf-8").read()
          try:
              ast.parse(source)
          except SyntaxError as exc:
              raise SystemExit(1 if (exc.lineno or 0) <= 500 else 0)
          raise SystemExit(2)
          PY

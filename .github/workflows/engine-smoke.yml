# Temporary v0.28 diagnostic workflow; restored before merge.
name: engine-smoke

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "config/engine/**"
      - "pyproject.toml"
      - ".github/workflows/engine-smoke.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax
        run: python -m py_compile src/iwsim/fractal_regional_regime.py

schema_version: "1.0"
status: "canonical-pre-implementation"
date: "2026-09-23"
purpose: "Machine-readable registry for generic country EngineState v1."

rules:
  normalized_range_default: [0.0, 1.0]
  signed_range: [-1.0, 1.0]
  country_specific_equations_forbidden: true
  silent_default_values_forbidden: true
  missing_required_latent_requires_documented_prior: true
  sampled_prior_requires_rng_trace: true
  every_initial_value_requires_init_rule_id: true
  every_runtime_delta_requires_equation_id: true

physical_stocks:
  - id: population_total
    unit: persons
    nullable: false
    source_sections: [population]
  - id: working_age_population
    unit: persons
    nullable: true
    source_sections: [population, manpower]
  - id: dependent_population
    unit: persons
    nullable: true
    source_sections: [population, demographic_dynamics]
  - id: displaced_people
    unit: persons
    nullable: false
    initial_value_policy: zero_unless_baseline_evidence
  - id: reception_population
    unit: persons
    nullable: false
    initial_value_policy: zero_or_baseline_program_load
  - id: fuel_stock_days_equivalent
    unit: days
    nullable: true
    source_sections: [energy_security]
  - id: strategic_food_stock_days
    unit: days
    nullable: true
    source_sections: [food_water_security]
  - id: available_police_personnel
    unit: persons
    nullable: true
    source_sections: [law_enforcement]
  - id: available_military_personnel
    unit: persons
    nullable: true
    source_sections: [armed_forces, manpower]
  - id: prison_population
    unit: persons
    nullable: true
    source_sections: [prisons]
  - id: foreign_reserves_usd
    unit: USD
    nullable: true
    source_sections: [economy]
  - id: gold_reserves_tonnes
    unit: tonnes
    nullable: true
    source_sections: [economy]

latent_groups:
  demographics_social:
    module_owner: demographics
    variables:
      - id: demographic_momentum
        range: [-1.0, 1.0]
        meaning: "Net slow demographic growth/decline pressure from fertility, age structure, mortality, migration and switching."
        init_rule_id: DEM_MOMENTUM_INIT_V1
        source_sections: [demographic_dynamics, demographic_differentials, religion, population]
        time_scale: long
      - id: migration_pressure
        range: [0.0, 1.0]
        meaning: "Pressure created by migration inflow relative to absorption capacity."
        init_rule_id: MIG_PRESSURE_INIT_V1
        source_sections: [population, demographic_differentials, external_social_finance, migration_welfare_policy]
        time_scale: medium
      - id: dependency_pressure
        range: [0.0, 1.0]
        meaning: "Demographic/fiscal pressure from dependent population relative to working-age population."
        init_rule_id: DEPENDENCY_PRESSURE_INIT_V1
        source_sections: [population, demographic_dynamics]
        time_scale: structural
      - id: social_cohesion
        range: [0.0, 1.0]
        direction: higher_is_more_resilient
        init_rule_id: SOCIAL_COHESION_INIT_V1
        source_sections: [governance, religion, regional_government_topology, information_environment]
        time_scale: medium
      - id: polarization
        range: [0.0, 1.0]
        direction: higher_is_more_stressed
        init_rule_id: POLARIZATION_INIT_V1
        source_sections: [governance, information_environment, violent_islamist_extremism]
        time_scale: short_medium
      - id: communal_fear
        range: [0.0, 1.0]
        direction: higher_is_more_stressed
        init_rule_id: COMMUNAL_FEAR_INIT_V1
        source_sections: [terrorism_threat_posture, violent_islamist_extremism, information_environment]
        time_scale: short
      - id: reception_pressure
        range: [0.0, 1.0]
        init_rule_id: RECEPTION_PRESSURE_INIT_V1
        source_sections: [migration_welfare_policy, population]
        time_scale: short_medium
      - id: displacement_pressure
        range: [0.0, 1.0]
        init_rule_id: DISPLACEMENT_PRESSURE_INIT_V1
        source_sections: [population, geography]
        time_scale: short_medium


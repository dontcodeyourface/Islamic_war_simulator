regimes:
  national_phase:
    values:
      - STABLE
      - TENSION
      - EMERGENCY
      - MASS_UNREST
      - ORGANIZED_POLITICAL_VIOLENCE
      - INSURGENCY
      - DUAL_AUTHORITY
      - CIVIL_WAR
      - STATE_FRAGMENTATION
    initial_rule_id: NATIONAL_PHASE_INIT_V1

  security_force_regime:
    values:
      - COHESIVE
      - STRAINED
      - SELECTIVE_NONCOMPLIANCE
      - COMMAND_FRACTURE
      - LOCALIZED_DEFECTION
      - MULTIPLE_COMMANDS
    initial_rule_id: SECURITY_FORCE_REGIME_INIT_V1

  prison_regime:
    values:
      - CONTROLLED
      - STAFF_STRESS
      - PARTIAL_CONTROL_LOSS
      - DISORDER
      - UNCONTROLLED_RELEASES
    initial_rule_id: PRISON_REGIME_INIT_V1

  organized_crime_regime:
    values:
      - NORMAL_MARKET
      - STRESS_ADAPTATION
      - BLACK_MARKET_EXPANSION
      - TERRITORIAL_INFLUENCE
      - PROTECTION_RELATIONSHIP
      - COERCIVE_LOCAL_ACTOR
    initial_rule_id: ORGANIZED_CRIME_REGIME_INIT_V1

dynamic_collections:
  demographic_cohorts:
    key: cohort_id
    examples: [religious_group, generation, age_band, nationality_or_origin_when_evidenced]
    rule: "Only instantiate cohorts supported by Snapshot v1 or scenario data. Preserve original category semantics."
  extremist_networks:
    key: network_id
    allowed_families: [violent_islamist, violent_ultranationalist, revolutionary, separatist]
    rule: "Network entities are separate from civilian demographic groups."
  criminal_networks:
    key: network_id
    rule: "Instantiate material organized-crime actors only when evidence or fractal refinement justifies them."
  regional_nodes:
    key: node_id
    rule: "Created only by data configuration or adaptive fractal refinement; must preserve parent lineage."

trace_contract:
  initial_value_fields:
    - init_rule_id
    - snapshot_field_refs
    - source_ids
    - normalization_version
    - uncertainty_refs
  runtime_delta_fields:
    - equation_id
    - parameter_ids
    - input_variable_refs
    - event_refs
    - edge_refs
    - value_before
    - raw_delta
    - bounded_delta
    - value_after
  forbidden:
    - silent_initialization
    - unversioned_equation
    - unreferenced_high_impact_parameter
    - country_specific_dynamic_override

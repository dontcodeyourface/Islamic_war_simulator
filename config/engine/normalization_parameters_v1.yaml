dynamic_equation_defaults:
  profile_note: "Synthetic coefficients are stability-test values only."
  generic_update:
    equation_id: GENERIC_BOUNDED_DELTA_V1
    formula: "x[t+1] = clamp(x[t] + gain*positive_pressure - loss*negative_pressure + recovery*(baseline_anchor-x[t]))"
  synthetic_smoke:
    fast_daily_gain: 0.035
    medium_daily_gain: 0.012
    structural_daily_gain: 0.003
    long_daily_gain: 0.0005
    fast_recovery: 0.025
    medium_recovery: 0.008
    structural_recovery: 0.002
    long_recovery: 0.0003
    max_single_day_latent_delta: 0.10
    max_single_day_structural_delta: 0.025

reciprocal_radicalization:
  equation_id: RECIPROCAL_RADICALIZATION_V1
  saturation: NORM_RATIO_SAT_V1
  rule: "Violent-network incidents may raise communal fear and opposing violent-network recruitment pressure; damping comes from social cohesion, policing, legitimacy, community rejection and credible communication."
  forbidden_direct_edges:
    - "muslim_population_share -> violent_islamist_pressure"
    - "christian_population_share -> violent_ultranationalist_pressure"
    - "conservative_vote_share -> violent_ultranationalist_pressure"
    - "left_vote_share -> revolutionary_extremist_pressure"
  synthetic_smoke:
    cross_reaction_gain: 0.020
    damping_gain: 0.025
    narrative_amplification_gain: 0.012

fractal_refinement:
  equation_id: REFINEMENT_TRIGGER_V1
  formula: "w_v*violence + w_i*institutional_stress + w_f*infrastructure_stress + w_n*network_activity + w_d*displacement"
  synthetic_smoke:
    weights:
      violence: 0.30
      institutional_stress: 0.25
      infrastructure_stress: 0.15
      network_activity: 0.20
      displacement: 0.10
    expand_threshold: 0.62
    expand_persistence_days: 8
    collapse_threshold: 0.38
    collapse_persistence_days: 34
  lineage_required: true

operator_order:

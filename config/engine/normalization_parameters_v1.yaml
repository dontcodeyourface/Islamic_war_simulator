graph_edge_normalization:
  channels:
    geographic_proximity:
      rule_id: EDGE_GEO_V1
      formula: "exp(-distance_km/lambda_km)"
      synthetic_smoke_parameters:
        lambda_km: 1000
    land_border:
      rule_id: EDGE_LAND_BORDER_V1
      values: {false: 0.0, true: 1.0}
    trade_dependency:
      rule_id: EDGE_TRADE_V1
      formula: "bounded bilateral trade exposure normalized by source/target economy"
    energy_dependency:
      rule_id: EDGE_ENERGY_V1
      formula: "bounded bilateral energy dependence"
    migration_link:
      rule_id: EDGE_MIGRATION_V1
      formula: "bounded recent migration-flow and migrant-stock connectivity"
    diaspora_link:
      rule_id: EDGE_DIASPORA_V1
      formula: "bounded cross-border family/diaspora connectivity; never faction alignment"
    alliance_link:
      rule_id: EDGE_ALLIANCE_V1
      formula: "formal commitment × interoperability × political availability"
    information_link:
      rule_id: EDGE_INFORMATION_V1
      formula: "shared language/media/platform exposure and cross-border information reach"
    criminal_network_link:
      rule_id: EDGE_CRIMINAL_V1
      formula: "documented transnational organized-crime connectivity"
    extremist_network_link:
      rule_id: EDGE_EXTREMIST_V1
      formula: "documented violent-network connectivity; never religious-population similarity"

spillover:
  equation_id: GRAPH_SPILLOVER_V1
  formula: "sum(channel_edge * source_pressure * channel_transmission) with channel latency and saturation"
  saturation_transform: NORM_RATIO_SAT_V1
  synthetic_smoke_channel_transmission:
    geographic_proximity: 0.010
    land_border: 0.020
    trade_dependency: 0.015
    energy_dependency: 0.020
    migration_link: 0.012
    diaspora_link: 0.006
    alliance_link: 0.018
    information_link: 0.025
    criminal_network_link: 0.012
    extremist_network_link: 0.018
  synthetic_smoke_latencies_days:
    geographic_proximity: [1,3]
    land_border: [0,2]
    trade_dependency: [2,13]
    energy_dependency: [1,8]
    migration_link: [3,34]
    diaspora_link: [3,21]
    alliance_link: [1,13]
    information_link: [0,3]
    criminal_network_link: [5,34]
    extremist_network_link: [5,34]

phase_rules:
  profile_note: "Numerical thresholds below are synthetic engineering thresholds for smoke tests only, not empirical real-world thresholds."
  STABLE_TO_TENSION_SYN_V1:
    persistence_days: 3
    any:
      - {variable: external_conflict_pressure, op: ">=", value: 0.35}
      - {variable: polarization, op: ">=", value: 0.45}
      - {variable: public_order_stress, op: ">=", value: 0.40}
  TENSION_TO_EMERGENCY_SYN_V1:
    persistence_days: 3
    all:
      - {variable: public_order_stress, op: ">=", value: 0.50}
      - {variable: government_legitimacy, op: "<=", value: 0.65}
  EMERGENCY_TO_MASS_UNREST_SYN_V1:
    persistence_days: 5
    all:
      - {variable: public_order_stress, op: ">=", value: 0.60}
      - {variable: polarization, op: ">=", value: 0.60}
      - {variable: social_cohesion, op: "<=", value: 0.55}
  MASS_UNREST_TO_ORGANIZED_POLITICAL_VIOLENCE_SYN_V1:
    persistence_days: 8
    all:
      - {variable: organized_armed_actor_capacity, op: ">=", value: 0.35}
      - {variable: public_order_stress, op: ">=", value: 0.65}
  ORGANIZED_POLITICAL_VIOLENCE_TO_INSURGENCY_SYN_V1:
    persistence_days: 13
    all:
      - {variable: organized_armed_actor_capacity, op: ">=", value: 0.50}
      - {variable: security_chain_cohesion, op: "<=", value: 0.60}
      - {variable: territorial_control, op: "<=", value: 0.90}
  INSURGENCY_TO_DUAL_AUTHORITY_SYN_V1:
    persistence_days: 13
    all:
      - {variable: territorial_control, op: "<=", value: 0.75}
      - {variable: center_region_cohesion, op: "<=", value: 0.50}
      - {variable: state_cohesion, op: "<=", value: 0.55}
      - {event_flag: competing_authority_present, equals: true}
  INSURGENCY_OR_DUAL_TO_CIVIL_WAR_SYN_V1:
    persistence_days: 21
    all:
      - {variable: organized_armed_actor_capacity, op: ">=", value: 0.65}
      - {variable: security_chain_cohesion, op: "<=", value: 0.45}
      - {variable: territorial_control, op: "<=", value: 0.70}
      - {variable: administrative_capacity, op: "<=", value: 0.60}
  CIVIL_WAR_TO_STATE_FRAGMENTATION_SYN_V1:
    persistence_days: 34
    all:
      - {variable: territorial_control, op: "<=", value: 0.45}
      - {variable: administrative_capacity, op: "<=", value: 0.40}
      - {variable: state_cohesion, op: "<=", value: 0.35}
      - {variable: command_cohesion, op: "<=", value: 0.40}
      - {variable: salary_payment_continuity, op: "<=", value: 0.50}

deescalation_policy:
  rule: "Reverse transitions require stricter recovery persistence than escalation and must use lower-stress/higher-resilience thresholds."
  synthetic_smoke_recovery_multiplier: 1.5
  minimum_recovery_days: 13
  hysteresis_required: true

security_force_regime_rules:
  synthetic_smoke:
    COHESIVE:
      condition: "security_chain_cohesion >= 0.75 and command_cohesion >= 0.75"
    STRAINED:
      condition: "security_chain_cohesion < 0.75 or operational_fatigue >= 0.45"
    SELECTIVE_NONCOMPLIANCE:
      condition: "security_chain_cohesion <= 0.60 and constitutional_loyalty <= 0.70"
      persistence_days: 8
    COMMAND_FRACTURE:
      condition: "command_cohesion <= 0.50 and security_chain_cohesion <= 0.50"
      persistence_days: 13
    LOCALIZED_DEFECTION:
      condition: "command_cohesion <= 0.40 and center_region_cohesion <= 0.45 and competing_authority_present"
      persistence_days: 13
    MULTIPLE_COMMANDS:
      condition: "command_cohesion <= 0.30 and state_cohesion <= 0.35 and multiple_authority_nodes_present"
      persistence_days: 21

event_hazard_model:
  equation_id: EVENT_HAZARD_SCORE_V1
  model: "bounded hazard score -> profile-specific probability conversion"
  formula: "score = base + weighted_state_terms + weighted_memory_terms + weighted_graph_terms + event_context; score clamped 0..1"
  calibrated_probability_conversion:
    status: "UNDEFINED_PENDING_BACKTEST"
  synthetic_smoke_probability_conversion:
    formula: "p_day = p_floor + scale * score"
    parameters:
      p_floor: 0.0001
      scale: 0.010
    warning: "Synthetic CI/test frequency only; never interpret as real event probability."


calibration_gate:
  calibrated_v1_requirements:
    - "Historical cases from multiple regions and conflict types."
    - "Holdout cases not used during parameter fitting."
    - "Baseline false-positive collapse rate reported."
    - "Phase-transition precision/recall or appropriate event-history metrics reported."
    - "Sensitivity and identifiability analysis."
    - "Posterior/parameter uncertainty retained."
    - "No demographic identity variable used as direct violent-propensity coefficient."
    - "No synthetic smoke-test numeric parameter reused silently."

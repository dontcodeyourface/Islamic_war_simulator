schema_version: "1.0"
status: "canonical-pre-implementation"
date: "2026-09-23"
purpose: "Normalization, memory, parameter, threshold and stochastic-hazard contract for EngineState v1."

principles:
  calibrated_analysis_must_not_use_synthetic_smoke_parameters: true
  synthetic_profile_is_not_real_world_probability: true
  parameter_literals_in_code_forbidden: true
  every_parameter_requires_parameter_id: true
  every_normalization_requires_rule_id: true
  every_prior_requires_prior_id: true
  every_phase_transition_requires_rule_id: true
  every_hazard_requires_hazard_id: true
  missing_calibrated_parameter_is_fatal: true
  country_specific_parameter_override_requires_explicit_data_or_scenario_provenance: true
  religious_identity_must_not_be_used_as_extremist_propensity: true
  political_identity_must_not_be_used_as_security_defection_propensity: true

profiles:
  synthetic_smoke_v1:
    purpose: "Engineering-only profile for deterministic tests, replay, bounded-feedback checks and CI."
    calibrated: false
    report_as_real_probability: false
    allow_public_interpretation_as_forecast: false
  calibrated_v1:
    purpose: "Future empirical/backtested profile."
    calibrated: true
    status: "UNPOPULATED"
    missing_parameter_policy: "fail_closed"
    report_as_real_probability: false

normalization_transforms:
  NORM_CLAMP_01_V1:
    formula: "min(1,max(0,x))"
  NORM_CLAMP_SIGNED_V1:
    formula: "min(1,max(-1,x))"
  NORM_RATIO_SAT_V1:
    formula: "x/(x+k)"
    parameter_ids: [NORM_RATIO_K]
  NORM_LOGISTIC_V1:
    formula: "1/(1+exp(-s*(x-m)))"
    parameter_ids: [NORM_LOGISTIC_SLOPE, NORM_LOGISTIC_MID]
  NORM_SIGNED_TANH_V1:
    formula: "tanh(x/s)"
    parameter_ids: [NORM_SIGNED_SCALE]
  NORM_LINEAR_ANCHOR_V1:
    formula: "(x-low)/(high-low), then clamp"
    parameter_ids: [ANCHOR_LOW, ANCHOR_HIGH]
  NORM_COMPLEMENT_V1:
    formula: "1-x"
  NORM_WEIGHTED_MEAN_V1:
    formula: "sum(w_i*x_i)/sum(w_i)"
  NORM_GEOMEAN_V1:
    formula: "exp(sum(w_i*ln(max(eps,x_i)))/sum(w_i))"
  NORM_ORDINAL_V1:
    formula: "lookup(category, versioned_mapping)"
  NORM_EVIDENCE_BLEND_V1:
    formula: "weighted mean of normalized empirical contributors; uncertainty tracked separately from mean"

confidence_model:
  quality_to_uncertainty_multiplier:
    high: 1.0
    medium: 1.35
    low: 1.8
    unavailable: null
  freshness_to_uncertainty_multiplier:
    current: 1.0
    recent: 1.10
    aging: 1.30
    stale: 1.65
    structural: 1.0
  rules:
    - "Source quality/freshness widen uncertainty; they do not silently drag the normalized mean toward 0.5."
    - "Derived values inherit contributor uncertainty plus derivation penalty."
    - "Imputed values must record prior_fraction > 0."
    - "Conflicting empirical sources must remain visible in contribution trace."

memory_classes:
  immediate:
    ema_half_life_days: 2
    comparison_windows_days: [1,2,3]
  short:
    ema_half_life_days: 8
    comparison_windows_days: [3,5,8,13]
  medium:
    ema_half_life_days: 34
    comparison_windows_days: [13,21,34,55]
  structural:
    ema_half_life_days: 144
    comparison_windows_days: [55,89,144,233]
  long:
    ema_half_life_days: 610
    comparison_windows_days: [233,377,610,987]
  note: "Half-lives are engineering defaults inspired by multiscale/Fibonacci spacing and require empirical validation."

uncertainty:
  rng_stream: uncertainty_sampling
  allowed_distributions: [beta, normal_truncated, lognormal_truncated, triangular, uniform_bounded, categorical]
  correlation_method: "Gaussian copula or explicitly documented multivariate distribution"
  no_unbounded_null_sampling: true
  correlation_groups:
    GOV_INSTITUTIONAL_V1:
      variables: [government_legitimacy,state_cohesion,elite_cohesion,administrative_capacity,judicial_continuity,fiscal_capacity,salary_payment_continuity]
      expected_sign: positive
    SECURITY_CAPACITY_V1:
      variables: [police_effective_capacity,intelligence_effectiveness,security_chain_cohesion,command_cohesion,constitutional_loyalty]
      expected_sign: positive
    RESOURCE_RESILIENCE_V1:
      variables: [energy_resilience,electricity_functionality,fuel_distribution_functionality,food_resilience,water_resilience,transport_logistics_functionality]
      expected_sign: positive
    MILITARY_CAPACITY_V1:
      variables: [military_land_effective,military_air_effective,military_naval_effective,military_isr_ew_effective,military_drone_cuas_effective,military_logistics_availability,defence_industrial_capacity,replenishment_capacity]
      expected_sign: positive
    SOCIAL_STRESS_V1:
      variables: [polarization,communal_fear,public_order_stress,terrorism_threat_pressure]
      expected_sign: positive
    STATE_RESILIENCE_STRESS_INVERSE_V1:
      variables_resilient: [social_cohesion,government_legitimacy,state_cohesion]
      variables_stress: [polarization,communal_fear,regional_fragmentation_pressure]
      expected_sign: negative_cross_group
    EXTREMIST_FEEDBACK_V1:
      variables: [violent_islamist_pressure,violent_ultranationalist_pressure,civilizational_narrative_strength,communal_fear]
      expected_sign: positive_under_crisis_not_identity_based

prior_policy:
  calibrated_v1:
    rule: "No generic prior may be used for a required latent unless registered and justified by calibration/domain evidence."
  synthetic_smoke_v1:
    rng_stream: uncertainty_sampling
    priors:
      PRIOR_RESILIENT_INSTITUTION_V1:
        distribution: beta
        alpha: 8
        beta: 2
        scope: "engineering-only resilient-state tests"
      PRIOR_NEUTRAL_CAPACITY_V1:
        distribution: beta
        alpha: 5
        beta: 3
        scope: "engineering-only capacity placeholder"
      PRIOR_LOW_STRESS_V1:
        distribution: beta
        alpha: 2
        beta: 8
        scope: "engineering-only baseline stress placeholder"
      PRIOR_MODERATE_STRESS_V1:
        distribution: beta
        alpha: 3
        beta: 6
        scope: "engineering-only uncertain stress placeholder"
      PRIOR_SIGNED_STABLE_MOMENTUM_V1:
        distribution: normal_truncated
        mean: 0.0
        sd: 0.15
        lower: -1.0
        upper: 1.0
        scope: "engineering-only demographic momentum placeholder"


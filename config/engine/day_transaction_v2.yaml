schema_version: "2.0"
status: "implementation-v0.9"
purpose: "Atomic deterministic day transaction with phase persistence evaluation and commit."

inherits_semantics_from: "config/engine/day_transaction_v1.yaml"

atomicity:
  all_graph_nodes_required: true
  all_states_same_day_required: true
  evaluate_against_beginning_of_day_state: true
  stage_trace_until_commit: true
  clone_rng_until_commit: true
  input_states_must_remain_unchanged: true
  resolver_runs_once_per_day: true
  day_advance_after_successful_resolution: true
  phase_evaluation_after_day_advance: true
  phase_commit_before_transaction_commit: true
  failure_commits_nothing: true

event_evaluation_order:
  - event_type: "INTERSTATE_INCIDENT_V1"
    scope: "all_edges"
  - event_type: "MASS_PROTEST_TRIGGER_V1"
    scope: "all_nodes"

supported_scopes:
  - "all_edges"
  - "all_nodes"

execution:
  transaction_rule_id: "DAY_TRANSACTION_V2"
  candidate_snapshot: "beginning_of_day"
  proposal_snapshot: "beginning_of_day"
  owner_resolution: "single_batch"
  phase_transition: true
  phase_evaluator_config: "config/engine/phase_evaluator_v1.yaml"
  phase_resolver_config: "config/engine/phase_transition_resolver_v1.yaml"
  graph_spillover_effects: false
  recovery: false
  resource_depletion: false
  event_chaining_same_day: false
  deescalation: false

phase_context:
  unspecified_boolean_flags_default_false: true
  context_is_external_to_engine_state: true

trace:
  started_record: "day_transaction_started"
  committed_record: "day_transaction_committed"
  phase_evaluation_records_staged: true
  phase_commit_records_staged: true
  failed_record: null

determinism:
  event_order_source: "event_evaluation_order"
  edge_order: "edge_id_ascending"
  node_order: "node_id_ascending"
  phase_node_order: "node_id_ascending"
  same_day_events_do_not_observe_other_same_day_event_effects: true
  phase_evaluator_observes_committed_end_of_day_latents: true

safety_abstraction:
  tactical_target_selection: false
  weapon_selection: false
  attack_method: false
  route_planning: false
  operational_execution: false

schema_version: "1.0"
status: "implementation-v0.34a"
purpose: "Commit adjacent recursive fractal materialization with immutable generational topology lineage."

mode:
  expansion_commit_allowed: true
  collapse_commit_allowed: false
  engine_state_child_activation: false
  country_graph_child_activation: false
  explicit_catalog_required: true

recursive:
  enabled: true
  adjacent_levels_only: true
  allowed_expansions:
    L1_COUNTRY: "L2_REGION"
    L2_REGION: "L3_METRO_OR_LOGISTICS_AREA"
  deferred_expansions:
    L3_METRO_OR_LOGISTICS_AREA: "L4_ACTOR_NETWORK"
    L4_ACTOR_NETWORK: "L5_EVENT_CLUSTER"
  runtime_authority_generalization: "v0.34b"

catalog_constraints:
  min_children: 2
  max_children: 20
  child_ids_must_be_parent_namespaced: true
  initialization_weights_must_sum_to_one: true

lifecycle:
  policy_id: "FRACTAL_TOPOLOGY_GENERATION_V1"
  preserve_closed_lineage: true
  never_reactivate_closed_runtime_node: true
  first_generation_uses_catalog_child_id: true
  subsequent_generation_suffix: "::g{generation}"
  generation_starts_at: 1
  generation_advances_by_one: true
  current_catalog_child_set_must_match_history: true
  complete_sibling_generation_history_required: true
  reserved_catalog_generation_suffix_forbidden: true

lineage:
  preserve_parent_node: true
  preserve_refinement_action_id: true
  preserve_refinement_reason: true
  preserve_source_variables: true
  preserve_initialization_weight: true
  preserve_initialization_weight_policy_id: true
  preserve_inherited_uncertainty_policy_id: true
  preserve_aggregation_rule_id: true
  preserve_catalog_source_id: true
  preserve_catalog_child_id: true
  preserve_lineage_generation: true
  preserve_lineage_policy_id: true

safety:
  no_implicit_region_generation: true
  no_engine_state_child_activation: true
  no_country_graph_child_activation: true

schema_version: "1.0"
status: "implementation-v0.24"
purpose: "Atomic synchronous one-day transaction contract."

mode:
  atomic: true
  synchronous_event_evaluation: true
  one_resolution_pass: true
  advance_clock_after_resolution: true
  phase_transitions_allowed: true
  phase_transitions_require_explicit_enable_flag: true
  phase_transition_commit_contract: "config/engine/phase_transition_v1.yaml"
  graph_spillover_trace_allowed: true
  graph_spillover_requires_explicit_enable_flag: true
  graph_spillover_contract: "config/engine/graph_spillover_v1.yaml"
  graph_spillover_effects_allowed: true
  extremist_network_dynamics_allowed: true
  extremist_network_dynamics_requires_explicit_enable_flag: true
  extremist_network_dynamics_contract: "config/engine/extremist_network_dynamics_v1.yaml"
  reciprocal_radicalization_allowed: true
  reciprocal_radicalization_requires_explicit_enable_flag: true
  reciprocal_radicalization_contract: "config/engine/reciprocal_radicalization_v1.yaml"
  security_chain_dynamics_allowed: true
  security_chain_dynamics_requires_explicit_enable_flag: true
  security_chain_dynamics_contract: "config/engine/security_chain_dynamics_v1.yaml"
  security_regime_evaluator_allowed: true
  security_regime_evaluator_requires_explicit_enable_flag: true
  security_regime_evaluator_contract: "config/engine/security_regime_evaluator_v1.yaml"
  security_regime_commit_allowed: true
  security_regime_commit_requires_explicit_enable_flag: true
  security_regime_transition_contract: "config/engine/security_regime_transition_v1.yaml"
  security_regime_recovery_evaluator_allowed: true
  security_regime_recovery_evaluator_requires_explicit_enable_flag: true
  security_regime_recovery_contract: "config/engine/security_regime_recovery_v1.yaml"
  security_regime_recovery_commit_allowed: true
  security_regime_recovery_commit_requires_explicit_enable_flag: true
  security_regime_recovery_transition_contract: "config/engine/security_regime_recovery_transition_v1.yaml"
  fractal_refinement_evaluator_allowed: true
  fractal_refinement_requires_explicit_enable_flag: true
  fractal_refinement_contract: "config/engine/fractal_refinement_v1.yaml"
  fractal_materialization_allowed: true
  fractal_materialization_requires_explicit_enable_flag: true
  fractal_materialization_contract: "config/engine/fractal_materialization_v1.yaml"
  fractal_region_catalog_contract: "config/engine/fractal_region_catalog_v1.yaml"
  fractal_child_state_initialization_allowed: true
  fractal_child_state_initialization_requires_explicit_enable_flag: true
  fractal_child_state_contract: "config/engine/fractal_child_state_v1.yaml"
  fractal_uncertainty_allowed: true
  fractal_uncertainty_requires_explicit_enable_flag: true
  fractal_uncertainty_contract: "config/engine/fractal_uncertainty_v1.yaml"
  fractal_reaggregation_allowed: true
  fractal_reaggregation_requires_explicit_enable_flag: true
  fractal_reaggregation_contract: "config/engine/fractal_reaggregation_v1.yaml"
  fractal_child_engine_state_activation_allowed: false
  fractal_child_random_variation_allowed: true
  recovery_allowed: true
  recovery_requires_explicit_enable_flag: true
  recovery_contract: "config/engine/recovery_v1.yaml"
  resource_depletion_allowed: false
  event_chaining_allowed: false

candidate_passes:
  - event_type: "INTERSTATE_INCIDENT_V1"
    scope: "all_graph_edges"
  - event_type: "MASS_PROTEST_TRIGGER_V1"
    scope: "all_country_nodes"

transaction_rules:
  state_nodes_must_equal_graph_nodes: true
  all_states_must_share_day: true
  all_candidates_observe_beginning_of_day_state: true
  all_proposals_use_beginning_of_day_values: true
  graph_spillover_trace_observes_beginning_state: true
  matured_spillover_proposals_use_current_beginning_state: true
  spillover_queue_must_commit_only_after_success: true
  extremist_network_proposals_observe_beginning_state: true
  reciprocal_radicalization_observes_beginning_state: true
  security_chain_proposals_observe_beginning_state: true
  security_regime_evaluation_uses_end_of_day_resolved_state: true
  security_regime_persistence_must_commit_only_after_success: true
  security_regime_history_required_after_day_zero_when_enabled: true
  security_regime_commit_must_be_atomic_with_day_transaction: true
  security_regime_max_commits_per_node_per_day: 1
  security_regime_commit_resets_transition_streaks: true
  security_regime_recovery_requires_committed_escalation_precedence: true
  security_regime_recovery_uses_end_of_day_committed_security_state: true
  security_regime_recovery_persistence_must_commit_only_after_success: true
  security_regime_recovery_history_required_after_day_zero_when_enabled: true
  security_regime_recovery_same_day_escalation_suppresses_recovery: true
  security_regime_recovery_commit_is_atomic_with_day_transaction: true
  security_regime_recovery_commit_resets_escalation_and_recovery_streaks: true
  security_regime_recovery_max_commits_per_node_per_day: 1
  fractal_refinement_uses_post_phase_committed_state: true
  fractal_refinement_persistence_must_commit_only_after_success: true
  fractal_refinement_history_required_after_day_zero_when_enabled: true
  fractal_refinement_is_read_only_in_v0_19: true
  fractal_materialization_topology_separate_from_country_graph: true
  fractal_materialization_topology_history_required_after_day_zero: true
  fractal_materialization_requires_explicit_region_catalog: true
  fractal_materialization_updates_refinement_level_only_after_commit: true
  fractal_materialization_preserves_closed_runtime_lineage: true
  fractal_materialization_catalog_child_identity_stable: true
  fractal_materialization_generation_monotonic: true
  fractal_materialization_closed_instance_reactivation_forbidden: true
  fractal_materialization_catalog_topology_change_requires_migration: true
  fractal_collapse_commit_allowed: true
  fractal_collapse_reaggregation_after_uncertainty: true
  fractal_collapse_requires_complete_active_sibling_set: true
  fractal_collapse_removes_child_states: true
  fractal_collapse_marks_topology_lineage_inactive: true
  fractal_collapse_preserves_parent_only_stocks: true
  fractal_child_state_store_separate_from_l1_states: true
  fractal_child_state_store_history_required_after_day_zero: true
  fractal_child_state_initialization_after_topology_commit: true
  fractal_child_additive_conservation_required: true
  fractal_uncertainty_after_child_initialization: true
  fractal_uncertainty_only_new_children: true
  fractal_uncertainty_preserve_parent_weighted_latent_mean: true
  fractal_uncertainty_preserve_physical_stocks_and_regimes: true
  fractal_child_dynamics_allowed: false
  recovery_and_event_proposals_share_beginning_state: true
  all_state_delta_proposals_share_one_owner_resolution: true
  proposals_resolved_once_per_day: true
  each_state_advances_exactly_one_day: true
  caller_states_must_remain_unchanged: true
  rng_must_commit_only_after_success: true
  trace_must_commit_only_after_success: true
  phase_persistence_must_commit_only_after_success: true
  phase_history_required_after_day_zero_when_enabled: true
  unknown_event_type_or_scope: "fail_closed"

trace:
  started_record: "day_transaction_started"
  committed_record: "day_transaction_committed"
  checkpoints_per_node: true
  include_event_ids: true
  include_resolution_ids: true
  include_clamp_resolution_ids: true
  include_phase_commit_ids: true
  include_security_regime_commit_ids: true
  include_security_regime_recovery_commit_ids: true
  include_refinement_action_ids: true
  include_fractal_materialization_commit_ids: true
  include_fractal_child_initialization_ids: true
  include_fractal_conservation_audit_ids: true
  include_fractal_uncertainty_ids: true
  include_fractal_uncertainty_audit_ids: true
  include_fractal_collapse_commit_ids: true
  include_fractal_reaggregation_audit_ids: true
  include_applied_spillover_ids: true

ordering:
  graph_edges: "edge_id_ascending"
  country_nodes: "iso3_ascending"
  graph_spillover: "candidate_and_maturation_pass_before_events_effects_join_owner_resolution"
  occurred_events: "event_id_ascending"
  proposals: "event_recovery_matured_spillover_network_reciprocal_and_security_collected_then_proposal_id_ascending_before_resolution"
  security_regime_evaluation: "after_state_resolution_and_clock_advance"
  security_regime_commit: "after_security_regime_evaluation"
  security_regime_recovery_evaluation: "after_security_regime_commit"
  security_regime_recovery_commit: "after_security_regime_recovery_evaluation_before_phase_evaluation"
  phase_evaluation: "after_security_regime_recovery_commit"
  phase_arbitration: "highest_target_phase_order_then_proposal_id_ascending"
  fractal_refinement_evaluation: "after_phase_commit"
  fractal_materialization: "after_fractal_refinement"
  fractal_child_state_initialization: "after_fractal_materialization"
  fractal_uncertainty: "after_fractal_child_state_initialization"
  fractal_reaggregation: "after_fractal_uncertainty_before_checkpoint"

safety_abstraction:
  tactical_target_selection: false
  weapon_selection: false
  route_planning: false
  operational_execution: false

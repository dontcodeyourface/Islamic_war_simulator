schema_version: "1.0"
status: "implementation-v0.16"
purpose: "Atomic synchronous one-day transaction contract."

mode:
  atomic: true
  synchronous_event_evaluation: true
  one_resolution_pass: true
  advance_clock_after_resolution: true
  phase_transitions_allowed: true
  phase_transitions_require_explicit_enable_flag: true
  phase_transition_commit_contract: "config/engine/phase_transition_v1.yaml"
  graph_spillover_trace_allowed: true
  graph_spillover_requires_explicit_enable_flag: true
  graph_spillover_contract: "config/engine/graph_spillover_v1.yaml"
  graph_spillover_effects_allowed: true
  extremist_network_dynamics_allowed: true
  extremist_network_dynamics_requires_explicit_enable_flag: true
  extremist_network_dynamics_contract: "config/engine/extremist_network_dynamics_v1.yaml"
  reciprocal_radicalization_allowed: true
  reciprocal_radicalization_requires_explicit_enable_flag: true
  reciprocal_radicalization_contract: "config/engine/reciprocal_radicalization_v1.yaml"
  security_chain_dynamics_allowed: true
  security_chain_dynamics_requires_explicit_enable_flag: true
  security_chain_dynamics_contract: "config/engine/security_chain_dynamics_v1.yaml"
  security_regime_evaluator_allowed: true
  security_regime_evaluator_requires_explicit_enable_flag: true
  security_regime_evaluator_contract: "config/engine/security_regime_evaluator_v1.yaml"
  security_regime_commit_allowed: false
  recovery_allowed: true
  recovery_requires_explicit_enable_flag: true
  recovery_contract: "config/engine/recovery_v1.yaml"
  resource_depletion_allowed: false
  event_chaining_allowed: false

candidate_passes:
  - event_type: "INTERSTATE_INCIDENT_V1"
    scope: "all_graph_edges"
  - event_type: "MASS_PROTEST_TRIGGER_V1"
    scope: "all_country_nodes"

transaction_rules:
  state_nodes_must_equal_graph_nodes: true
  all_states_must_share_day: true
  all_candidates_observe_beginning_of_day_state: true
  all_proposals_use_beginning_of_day_values: true
  graph_spillover_trace_observes_beginning_state: true
  matured_spillover_proposals_use_current_beginning_state: true
  spillover_queue_must_commit_only_after_success: true
  extremist_network_proposals_observe_beginning_state: true
  reciprocal_radicalization_observes_beginning_state: true
  security_chain_proposals_observe_beginning_state: true
  security_regime_evaluation_uses_end_of_day_resolved_state: true
  security_regime_persistence_must_commit_only_after_success: true
  security_regime_history_required_after_day_zero_when_enabled: true
  recovery_and_event_proposals_share_beginning_state: true
  all_state_delta_proposals_share_one_owner_resolution: true
  proposals_resolved_once_per_day: true
  each_state_advances_exactly_one_day: true
  caller_states_must_remain_unchanged: true
  rng_must_commit_only_after_success: true
  trace_must_commit_only_after_success: true
  phase_persistence_must_commit_only_after_success: true
  phase_history_required_after_day_zero_when_enabled: true
  unknown_event_type_or_scope: "fail_closed"

trace:
  started_record: "day_transaction_started"
  committed_record: "day_transaction_committed"
  checkpoints_per_node: true
  include_event_ids: true
  include_resolution_ids: true
  include_clamp_resolution_ids: true
  include_phase_commit_ids: true
  include_applied_spillover_ids: true

ordering:
  graph_edges: "edge_id_ascending"
  country_nodes: "iso3_ascending"
  graph_spillover: "candidate_and_maturation_pass_before_events_effects_join_owner_resolution"
  occurred_events: "event_id_ascending"
  proposals: "event_recovery_matured_spillover_network_reciprocal_and_security_collected_then_proposal_id_ascending_before_resolution"
  security_regime_evaluation: "after_state_resolution_and_clock_advance_before_phase_evaluation"
  phase_evaluation: "after_state_resolution_and_clock_advance"
  phase_arbitration: "highest_target_phase_order_then_proposal_id_ascending"

safety_abstraction:
  tactical_target_selection: false
  weapon_selection: false
  route_planning: false
  operational_execution: false

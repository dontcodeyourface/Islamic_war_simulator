schema_version: "1.0"
status: "implementation-v0.34c3"
purpose: "One-time bounded synthetic local variation for newly created L2/L3 spatial child latents."

mode:
  enabled: true
  apply_only_on_new_children: true
  child_dynamics_allowed: false
  physical_stocks_immutable: true
  regimes_immutable: true
  preserve_parent_weighted_mean: true
  calibrated_fallback_allowed: false

policy_id: "FRACTAL_SPATIAL_LOCAL_VARIATION_V2"
topology_uncertainty_policy_id: "FRACTAL_UNCERTAINTY_WIDENING_V1"

parameter_id_by_profile:
  synthetic_smoke_v1: "FRACTAL_L2_LOCAL_VARIATION_SYN_V1"
  calibrated_v1: "FRACTAL_L2_LOCAL_VARIATION_CAL_V1"


snapshot_v1_freeze_policy:
  schema_major_version: 1
  frozen_required_sections: true
  new_required_section_requires_major_schema_bump: true
  country_registration_must_use_template: "config/countries/_snapshot_v1_template.yaml"
  distance_metric: "capital_to_capital_great_circle_km"
  tactical_burn_rates_in_country_snapshot: false
  military_consumption_policy: "scenario_derived_from_force_mix_tempo_duration_and_logistics"
  religion_specific_fertility_requires_direct_evidence: true
  nationality_or_origin_must_not_proxy_religion: true
  religious_demography_must_not_proxy_extremism: true
  adaptive_fractal_resolution: true
  normal_runtime_target_latent_variables_per_country: "30-60"

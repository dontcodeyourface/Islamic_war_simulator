schema_version: "0.4"
schema_name: "country_snapshot"
status: "canonical-pre-engine"

# Every empirical field should use this record shape unless the field is structural.
datum_template:
  value: null
  unit: null
  geographic_scope: null
  reference_date: null
  source_ids: []
  quality: "unavailable"   # high | medium | low | unavailable
  freshness_class: null    # current | recent | aging | stale | structural
  estimated: false
  derived: false
  imputed: false
  uncertainty:
    mode: "unknown"        # deterministic | interval | distribution | scenario | unknown
    lower: null
    upper: null
    distribution: null     # uniform | triangular | beta | normal | lognormal | empirical | custom
    parameters: {}
    correlation_group: null
    confidence: null
  notes: null

required_sections:
  - identity
  - population
  - religion
  - manpower
  - armed_forces
  - military_domains
  - weapon_categories
  - defence_industry
  - intelligence
  - cyber
  - ai
  - economy
  - geography
  - alliances
  - governance
  - provenance_notes

